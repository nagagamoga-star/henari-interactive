name: Deploy Henari Interactive

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pages-deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pages repository
        uses: actions/checkout@v4

      - name: Check out the wildlife game
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WILDLIFE_REPOSITORY || 'nagagamoga-star/henari-interactive-source' }}
          ref: ${{ vars.WILDLIFE_REF || 'master' }}
          ssh-key: ${{ secrets.WILDLIFE_DEPLOY_KEY }}
          persist-credentials: false
          path: source/wildlife

      - name: Check out the profile builder
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PROFILE_REPOSITORY || 'nagagamoga-star/henari-everyday-tools-source' }}
          ref: ${{ vars.PROFILE_REF || 'main' }}
          ssh-key: ${{ secrets.PROFILE_DEPLOY_KEY }}
          persist-credentials: false
          path: source/profile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and build the wildlife game
        working-directory: source/wildlife
        env:
          VITE_BASE: /${{ github.event.repository.name }}/wildlife-memory/
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Calm Bubbles
        working-directory: source/wildlife
        env:
          VITE_BASE: /${{ github.event.repository.name }}/calm-bubbles/
        run: npm run build:calm

      - name: Build Ready Plan
        working-directory: source/wildlife
        env:
          VITE_BASE: /${{ github.event.repository.name }}/ready-plan/
        run: npm run build:ready

      - name: Build Line Puzzles
        working-directory: source/wildlife
        env:
          VITE_BASE: /${{ github.event.repository.name }}/line-puzzles/
        run: npm run build:lines

      - name: Build My Week
        working-directory: source/wildlife
        env:
          VITE_BASE: /${{ github.event.repository.name }}/my-week/
        run: npm run build:week

      - name: Build Crossword
        working-directory: source/wildlife
        env:
          VITE_BASE: /${{ github.event.repository.name }}/crossword/
        run: npm run build:crossword

      - name: Test and build the profile builder
        working-directory: source/profile
        env:
          VITE_BASE: /${{ github.event.repository.name }}/profile-builder/
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble and verify the site
        env:
          SITE_DIR: site
          WILDLIFE_DIST: source/wildlife/apps/wildlife-memory/dist
          PROFILE_DIST: source/profile/dist
          CALM_DIST: source/wildlife/apps/calm-bubbles/dist
          READY_DIST: source/wildlife/apps/ready-plan/dist
          LINES_DIST: source/wildlife/apps/line-puzzles/dist
          MY_WEEK_DIST: source/wildlife/apps/my-week/dist
          CROSSWORD_DIST: source/wildlife/apps/crossword/dist
          PAGES_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node assemble.mjs

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
